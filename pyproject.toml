[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipscan"
version = "0.1.0"
description = "Marketplace flip scanner — finds high-margin resale deals near Portland, grades them with vision + comps, and pushes them to your phone."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "anthropic>=0.40",
  "apscheduler>=3.10",
  "pillow>=10.3",
  "typer>=0.12",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# The browser collector. Heaviest dep — skip it if you only use manual/demo mode.
browser = ["playwright>=1.45"]
# Push transports beyond ntfy (ntfy needs nothing but httpx).
push = ["pywebpush>=2.0", "pyjwt[crypto]>=2.8", "h2>=4.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
flipscan = "flipscan.cli:app"

[tool.setuptools.packages.find]
where = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
