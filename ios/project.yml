# XcodeGen spec. Generates FlipScan.xcodeproj from these sources so the
# project file itself never needs to be committed or merged:
#
#   brew install xcodegen && cd ios && xcodegen generate && open FlipScan.xcodeproj

name: FlipScan
options:
  bundleIdPrefix: com.flipscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 'targeted' rather than 'complete': complete turns a pile of
    # UIKit-interop warnings into noise on a first build.
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  FlipScan:
    type: application
    platform: iOS
    sources:
      - path: FlipScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flipscan.app
        INFOPLIST_FILE: FlipScan/Support/Info.plist
        # Replace with your Apple Developer team id before building to a device.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: FlipScan/Support/FlipScan.entitlements
      properties:
        # 'development' for debug builds; switch to 'production' for TestFlight.
        aps-environment: development
    info:
      path: FlipScan/Support/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # Only needed to talk to a plain-http server on your LAN during
          # setup. Remove this block once the server is behind HTTPS.
          NSAllowsLocalNetworking: true
